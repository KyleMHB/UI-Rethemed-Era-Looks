<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="160" viewBox="0 0 480 160">
  <!-- White on clear, drawn at twice its on-screen size (240x80 on screen, two staggered rows of closely packed figures). Single-colour silhouettes
       after African rock art: San eland and wide-striding hunters from the Drakensberg, giraffe and
       lyre-horned cattle from the Saharan pastoral engravings. Original drawings in that style, kept
       inside the tile so nothing crosses an edge. -->
  <defs>
    <g id="eland">
      <path d="M6 12C8 6 20 5 28 8C31 6 34 6 36 8L41 13C42 15 40 16 38 15L34 13C33 17 30 19 26 19L12 19C8 19 5 17 6 12Z"/>
      <g fill="none" stroke-linecap="round">
        <path stroke-width="1.6" d="M37 8L40 1"/>
        <path stroke-width="2.2" d="M10 18L9 30M14 19L15 30M27 19L26 30M31 18L33 30"/>
        <path stroke-width="1.2" d="M6 13L3 20"/>
      </g>
    </g>
    <g id="giraffe">
      <path d="M6 26C6 22 10 20 18 20C22 20 24 22 24 26C22 29 10 29 6 26Z"/>
      <path d="M20 22L28 4L31 5L24 24Z"/>
      <path d="M27 4C28 1 32 0 35 2L36 4C33 5 30 6 28 6Z"/>
      <g fill="none" stroke-linecap="round">
        <path stroke-width="1.2" d="M29 2L29 -1M6 25L3 33"/>
        <path stroke-width="2" d="M8 27L7 44M11 28L12 44M20 28L19 44M23 27L25 44"/>
      </g>
    </g>
    <g id="archer">
