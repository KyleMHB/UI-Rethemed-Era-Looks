        <path stroke-width="1.2" d="M36 11C40 14 40 20 39 24"/>
      </g>
    </g>
  </defs>
  <defs><g id="rows">
    <use xlink:href="#eland" transform="translate(8 19.85) scale(1.3)"/>
    <use xlink:href="#archer" transform="translate(72 20.5) scale(1.3)"/>
    <use xlink:href="#spearman" transform="translate(102 21.8) scale(1.3)"/>
    <use xlink:href="#giraffe" transform="translate(150 16.35) scale(1.1)"/>
    <use xlink:href="#cattle" transform="translate(196 21.15) scale(1.3)"/>
    <use xlink:href="#eland" transform="translate(314 19.85) scale(-1.3 1.3)"/>
    <use xlink:href="#archer" transform="translate(330 20.5) scale(1.3)"/>
    <use xlink:href="#cattle" transform="translate(372 21.15) scale(1.3)"/>
    <use xlink:href="#spearman" transform="translate(432 21.8) scale(1.3)"/>
    <use xlink:href="#cattle" transform="translate(70 101.15) scale(-1.3 1.3)"/>
    <use xlink:href="#giraffe" transform="translate(84 96.35) scale(1.1)"/>
    <use xlink:href="#eland" transform="translate(132 99.85) scale(1.3)"/>
    <use xlink:href="#archer" transform="translate(198 100.5) scale(1.3)"/>
    <use xlink:href="#spearman" transform="translate(228 101.8) scale(1.3)"/>
    <use xlink:href="#eland" transform="translate(336 99.85) scale(-1.3 1.3)"/>
    <use xlink:href="#cattle" transform="translate(350 101.15) scale(1.3)"/>
    <use xlink:href="#archer" transform="translate(412 100.5) scale(1.3)"/>
    <g stroke="none"><circle cx="460" cy="112" r="2.4"/><circle cx="467" cy="118" r="2.4"/><circle cx="459" cy="124" r="2.4"/></g>
  </g></defs>
  <!-- LFS Core puts a tile edge at the middle of every bar it patterns, so the rows sit 40 lower than drawn: the
       second row is centred on the tile edge, and its copy 160 higher completes it across the top. -->
  <g fill="#fff" stroke="#fff">
    <use xlink:href="#rows" y="40"/>
    <use xlink:href="#rows" y="-120"/>
  </g>
</svg>