        <path stroke-width="3" d="M12 6L11 16"/>
        <path stroke-width="2.2" d="M11 16L3 30M11 16L20 29"/>
        <path stroke-width="1.6" d="M12 8L19 10M12 8L6 12"/>
        <path stroke-width="1.4" d="M19 2Q25 10 19 18"/>
        <path stroke-width="1.2" d="M10 7L6 0"/>
      </g>
    </g>
    <g id="spearman">
      <circle cx="12" cy="3" r="2.4"/>
      <g fill="none" stroke-linecap="round">
        <path stroke-width="3" d="M12 6L11 16"/>
        <path stroke-width="2.2" d="M11 16L2 28M11 16L21 27"/>
        <path stroke-width="1.6" d="M12 8L18 7M12 9L7 13"/>
        <path stroke-width="1.2" d="M2 14L28 3"/>
      </g>
    </g>
    <g id="cattle">
